[package]
name = "invro_libera_standalone"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1.37.0", features = ["full"] }
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
walkdir = "2"
base64 = "0.22"
zip = "0.6.6"
chrono = "0.4.44"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
winreg = "0.55"
ed25519-dalek = { version = "2.1", features = ["serde"] }

[profile.release]
opt-level = "z"           # Maximum size optimization
lto = false               # Disable LTO to avoid MSVC linker stack overflow
codegen-units = 16        # Split into many small units for the linker
strip = true
